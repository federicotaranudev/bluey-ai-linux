name: GooglyEyes
options:
  bundleIdPrefix: co.visionairy.googly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  # Shared so CI can run `xcodebuild -scheme GooglyEyes archive`.
  GooglyEyes:
    build:
      targets:
        GooglyEyes: all
    archive:
      config: Release

targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.googly.phone
        PRODUCT_NAME: Googly Eyes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NF73NSV867
        # Set your team in Xcode (Signing & Capabilities) the first time you run it.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Googly Eyes
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Googly Eyes finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to your blueberry. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSBonjourServices:
          - _googly._tcp
        # The desktop can serve the Realtime socket on this local network (ws://),
        # which App Transport Security blocks unless local networking is allowed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
