[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluey-desktop"
version = "0.1.0"
description = "Ubuntu and Windows desktop companion for the existing Googly Eyes iPhone app"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.10,<7",
    "zeroconf>=0.132,<1",
    "mss>=9,<12",
    "Pillow>=10,<13",
    "pytesseract>=0.3.13,<0.4",
    "PyAutoGUI>=0.9.54,<1",
    "pynput>=1.7.7,<2",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "keyring>=25,<27",
    "platformdirs>=4,<5",
    "websockets>=13,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
bluey-desktop = "bluey.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bluey*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
