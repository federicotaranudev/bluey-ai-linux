name: iPhone app (.ipa)

# Builds the iPhone app on a macOS runner. It always produces something
# installable on the phone:
#
#   • GooglyEyes-unsigned.ipa — with no Apple account anywhere in CI. Sign and
#     install it on Ubuntu with a FREE Apple ID via AltServer-Linux
#     (docs/iphone-ubuntu.md → "Install with a free Apple ID").
#   • GooglyEyes.ipa — a fully signed build, produced only when the signing
#     secrets exist (paid Apple Developer Program account).
#
# Either way, no Mac is needed: download the artifact and install it with the
# scripts in this repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Googly Eyes
    # Xcode 26.6 (iOS 26 SDK): the app uses AVAudioSession's .allowBluetoothHFP,
    # which only exists in Xcode 26+; the macOS 15 image defaults to Xcode 16.4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROFILE_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets present."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: building an unsigned .ipa to sign with AltServer-Linux." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      # No Apple account needed: archive with signing switched off, then wrap the
      # .app in a Payload directory. AltServer-Linux signs this on your PC.
      - name: Build without signing
        if: steps.secrets.outputs.have == 'false'
        run: |
          xcodebuild -project GooglyEyes.xcodeproj -scheme GooglyEyes -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GooglyEyes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Package the unsigned .ipa
        if: steps.secrets.outputs.have == 'false'
        run: |
          set -euo pipefail
          APP=$(ls -d "$RUNNER_TEMP"/GooglyEyes.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry GooglyEyes-unsigned.ipa Payload)
          cp "$RUNNER_TEMP/unsigned/GooglyEyes-unsigned.ipa" "$RUNNER_TEMP/GooglyEyes-unsigned.ipa"
          echo "Packaged $(basename "$APP") as an unsigned .ipa." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unsigned .ipa
        if: steps.secrets.outputs.have == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GooglyEyes-unsigned-ipa
          path: ${{ runner.temp }}/GooglyEyes-unsigned.ipa
          if-no-files-found: error

      - name: Install the signing certificate
        if: steps.secrets.outputs.have == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$IOS_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Install the provisioning profile
        if: steps.secrets.outputs.have == 'true'
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print ApplicationIdentifierPrefix:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$DEST/$UUID.mobileprovision"
          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=${APP_ID#*.}"
          } >> "$GITHUB_ENV"
          echo "Signing with team $TEAM_ID, profile '$PROFILE_NAME', bundle ${APP_ID#*.}, expiring $(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' "$RUNNER_TEMP/profile.plist")"

      - name: Archive
        if: steps.secrets.outputs.have == 'true'
        run: |
          xcodebuild -project GooglyEyes.xcodeproj -scheme GooglyEyes -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GooglyEyes.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export the .ipa
        if: steps.secrets.outputs.have == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GooglyEyes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mv "$RUNNER_TEMP/export/"*.ipa "$RUNNER_TEMP/export/GooglyEyes.ipa"

      - name: Upload the .ipa
        if: steps.secrets.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GooglyEyes-ipa
          path: ${{ runner.temp }}/export/GooglyEyes.ipa
          if-no-files-found: error
